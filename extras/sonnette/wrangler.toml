# Seulement si tu préfères la ligne de commande (npm i -g wrangler). Avec le tableau de bord Cloudflare, ce fichier ne sert à rien.
name = "reveil-sonnette"
main = "worker.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "c16a56760f0d4b2f8f1483c134e2c461"

[vars]
REPO = "Terreur-L3/reveil-ia"
BRANCH = "main"
TELEGRAM_CHAT_ID = "8923851509"
TZ = "Europe/Paris"
LEAD_MIN = "15"

# Les secrets (jamais dans ce fichier) : wrangler secret put GITHUB_TOKEN | TELEGRAM_BOT_TOKEN | SECRET | RING_URL
