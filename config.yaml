# ===== Réglages du réveil IA =====
# Modifie ce fichier pour personnaliser. Rien de secret ici :
# les clés vont dans les « Secrets » GitHub (ou dans un fichier .env en local).
# Ce qui parle de TOI (prénom, centres d'intérêt, sujets à éviter) est dans moi.yaml.

prenom: ""           # prénom dit dans le bonjour (moi.yaml l'emporte s'il y est rempli)
fuseau: "Europe/Paris"
mots_cibles: 300     # ≈ 2 minutes à l'oral (environ 150 mots par minute)

# ----- Les IA, essayées dans l'ordre jusqu'à ce que l'une réponde (toutes ont une offre gratuite) -----
# Règle de confidentialité : tout ce qui vient de TA vie privée ne passe que par la chaîne « prive »
# (Groq : pas d'entraînement sur tes données). Gemini (offre gratuite) ne voit que des titres de presse.
llm:
  temperature: 0.7
  tri:            # note les actus (importance / intérêt / ton)
    - {fournisseur: gemini, modele: gemini-3-flash-preview}
    - {fournisseur: gemini, modele: gemini-3.1-flash-lite}
    - {fournisseur: gemini, modele: gemini-flash-latest}
    - {fournisseur: groq, modele: openai/gpt-oss-120b, extra: {reasoning_effort: low, max_completion_tokens: 3000}}
  ecriture:       # écrit le texte du podcast (aucune info perso ne lui est envoyée)
    - {fournisseur: gemini, modele: gemini-3-flash-preview}
    - {fournisseur: gemini, modele: gemini-3.1-flash-lite}
    - {fournisseur: gemini, modele: gemini-flash-latest}
    - {fournisseur: groq, modele: openai/gpt-oss-120b, extra: {reasoning_effort: low, max_completion_tokens: 2500}}
  prive:          # journal vocal : extraction des infos, questions « Inspi » (Groq uniquement, quotas séparés par modèle)
    - {fournisseur: groq, modele: openai/gpt-oss-120b, extra: {reasoning_effort: low, max_completion_tokens: 3000}}
    - {fournisseur: groq, modele: openai/gpt-oss-20b, extra: {reasoning_effort: low, max_completion_tokens: 3000}}
  vision:         # lecture de tes images (emploi du temps, documents) : Groq UNIQUEMENT, jamais Gemini
    # qwen3.8 est le seul modèle d'images de Groq à ce jour (Llama 4 Scout a été retiré en juillet 2026) : la 2e ligne
    # est la même chose sans options de raisonnement, au cas où Groq les refuserait. Une image à la fois (3 au plus).
    - {fournisseur: groq, modele: qwen/qwen3.8-27b, extra: {reasoning_effort: low, reasoning_format: hidden, max_completion_tokens: 8000}}
    - {fournisseur: groq, modele: qwen/qwen3.8-27b, extra: {max_completion_tokens: 8000}}

# ----- Choix des sujets : ce qui entre (ou pas) dans les 2 minutes -----
tri:
  nb_sujets: 5               # nombre de sujets maximum
  seuil_importance: 7        # un sujet passe s'il est important (≥ 7 sur 10)…
  seuil_interet: 7           # …OU s'il t'intéresse beaucoup (≥ 7 sur 10)
  minimum: 3                 # jour calme : on assouplit les seuils pour avoir au moins ça
  max_difficiles: 1          # au plus un sujet « difficile » (guerre, drame…) par podcast
  importance_exception: 9    # …sauf événement majeur (importance ≥ 9) : un de plus
  max_par_categorie: 2
  bonus_positif: 1           # les bonnes nouvelles passent devant
  malus_difficile: 1
  bonus_couverture: 0.5      # plusieurs journaux en parlent → un peu plus de poids

# ----- Infos perso : cours, anniversaires, rappels (phrases écrites par le programme) -----
# Si tu as une consigne sur la façon de les dire (« /consigne cite mes cours sans la salle »), Groq (jamais Gemini) les
# reformule, puis le programme vérifie qu'aucune heure ni aucun nom n'a changé. Sans consigne de ce genre : aucune IA.
perso:
  anniversaires_jours_avant: [7, 1, 0]
  rappels_jours_avant: [3, 1, 0]
  max_lignes: 4              # 0 = pas de segment perso du tout
  cours: true                # dire tes cours du jour (lus sur ton emploi du temps, voir /cours dans Telegram)
  consignes_dans_podcast: true   # tes consignes de style (/consignes) accompagnent l'écriture du podcast
  style_ia: true             # false = tes consignes ne s'appliquent pas à ces phrases : rien n'est envoyé à Groq

# ----- Réveil : le téléphone joue reveil.mp3 à l'heure choisie (/reveil dans Telegram) -----
reveil:
  sonnerie: true             # reveil.mp3 = petite sonnerie + podcast (latest.mp3 = le podcast seul, envoyé dans Telegram)
  sonnerie_s: 10             # durée de la sonnerie en secondes
  sonnerie_secours_s: 45     # sonnerie.mp3 : sonnerie seule, jouée si le podcast du jour n'est pas prêt à l'heure du réveil

# ----- Actus (RSS) : ajoute / retire des lignes pour changer tes sources -----
actu:
  age_max_heures: 36
  max_par_flux: 4
  max_total: 55
  flux:
    - {nom: franceinfo,        categorie: general,  url: "https://www.francetvinfo.fr/titres.rss"}
    - {nom: Le Monde,          categorie: general,  url: "https://www.lemonde.fr/rss/une.xml"}
    - {nom: Futura Sciences,   categorie: sciences, url: "https://www.futura-sciences.com/rss/actualites.xml"}
    - {nom: Good News Network, categorie: positif,  url: "https://www.goodnewsnetwork.org/feed/"}
    - {nom: Positive News,     categorie: positif,  url: "https://www.positive.news/feed/"}
    - {nom: Numerama,          categorie: tech,     url: "https://www.numerama.com/feed/"}
    - {nom: Next,              categorie: tech,     url: "https://next.ink/feed/"}
    - {nom: Korben,            categorie: tech,     url: "https://korben.info/feed"}
    - {nom: No Film School,    categorie: cinema,   url: "https://nofilmschool.com/rss.xml"}
    - {nom: CineD,             categorie: cinema,   url: "https://www.cined.com/feed/"}
    - {nom: ProVideo Coalition, categorie: cinema,  url: "https://www.provideocoalition.com/feed/"}
    - {nom: Blender,           categorie: 3d,       url: "https://www.blender.org/feed/"}
    - {nom: 80 Level,          categorie: 3d,       url: "https://80.lv/feed/"}
    - {nom: Road to VR,        categorie: vr,       url: "https://www.roadtovr.com/feed/"}
    - {nom: UploadVR,          categorie: vr,       url: "https://www.uploadvr.com/rss/"}
    - {nom: Réalité-Virtuelle, categorie: vr,       url: "https://www.realite-virtuelle.com/feed/"}
    - {nom: jeuxvideo.com,     categorie: jeux,     url: "https://www.jeuxvideo.com/rss/rss.xml"}
  # Après chaque podcast, le fichier choix.txt (branche « podcast ») dit quels flux ont répondu :
  # supprime ceux qui sont « EN ÉCHEC » depuis plusieurs jours.

# ----- Voix du podcast -----
voix:
  moteur: gemini          # gemini = voix très naturelles (gratuit, clé GEMINI_API_KEY) ; edge = voix classiques
                          # Si Gemini ne répond pas (quota, panne), le podcast sort quand même avec la voix Edge.
  gemini:
    voix: Sulafat         # Sulafat (chaleureuse), Achird (amicale), Kore, Charon, Orus, Algieba, Puck, Zephyr…
                          # Pour écouter : Telegram → /voix essai ; pour choisir : /voix sulafat
                          # Une voix créée sur mesure (« Voice design », nom en voice_…) se met ici aussi.
    style: "warm, natural and relaxed, like a friendly morning radio host chatting with a close friend; calm smooth pace, a light smile in the voice"
    modeles: [gemini-3.8-flash-tts, gemini-3.8-flash-lite-tts]   # essayés dans l'ordre
    delai_max_s: 90       # temps maximum passé à réessayer (quota, surcharge) avant la voix de secours
  edge_voix: fr-FR-HenriNeural   # voix de secours (et voix des questions « Inspi », qui restent privées)
                          # Autres voix Edge : fr-FR-DeniseNeural, fr-FR-RemyMultilingualNeural, fr-FR-VivienneMultilingualNeural
  vitesse: "+0%"          # ex. "+10%" pour parler plus vite, "-10%" plus lentement (valable pour les deux moteurs)
  essai: [Sulafat, Achird, Kore, Charon, Orus, Algieba]   # voix envoyées par « /voix essai »
  essai_pause_s: 12       # pause entre deux échantillons (le quota gratuit limite les appels par minute)

# ----- Telegram : ta conversation avec ton IA -----
telegram:
  envoyer_podcast: true  # le podcast du matin est aussi déposé dans la conversation Telegram

# ----- Journal vocal et mémoire -----
journal:
  heure_question: 19     # question du soir pour nourrir ta mémoire (heure locale, 0-23) ; null = jamais
  question_vocale: true  # la question est aussi dite à voix haute
  stt_modele: whisper-large-v3-turbo
  langue: fr
  morceau_s: 600         # les longs vocaux sont découpés en morceaux de 10 minutes
  audio_s_par_heure: 6500  # quota gratuit Groq : 7 200 s d'audio par heure (on garde une marge)
  tpm: 6500              # quota gratuit Groq : 8 000 « tokens » par minute (on garde une marge)
  fenetre_mots: 1800     # taille des tranches de texte envoyées à l'extraction
  duree_max_min: 14      # arrêt propre avant la limite de temps du job (le reste attend la fois suivante)
  min_mots_extraction: 8 # en dessous, on garde le message mais on n'en tire pas d'infos
